<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <defs>
    <linearGradient id="ivoryTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eee7dc"/>
    </linearGradient>
    <linearGradient id="ivoryBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2e9"/>
      <stop offset="1" stop-color="#e8e0d4"/>
    </linearGradient>
    <linearGradient id="greenTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155954"/>
      <stop offset="1" stop-color="#083d3a"/>
    </linearGradient>
    <linearGradient id="greenBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#104d49"/>
      <stop offset="1" stop-color="#062f2d"/>
    </linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="1.2" fill="#173f3b" opacity=".026"/>
      <circle cx="24" cy="22" r="1" fill="#ffffff" opacity=".022"/>
    </pattern>
    <style>
      .zh {
        font: 800 116px "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
        letter-spacing: 2px;
      }
      .zh-long {
        font: 800 104px "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
        letter-spacing: 1px;
      }
      .en {
        font: 700 54px Arial, Helvetica, sans-serif;
        letter-spacing: 4px;
      }
      .icon {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 16;
      }
    </style>
  </defs>

  <rect width="1250" height="843" fill="url(#ivoryTop)"/>
  <rect x="1250" width="1250" height="843" fill="url(#greenTop)"/>
  <rect y="843" width="1250" height="843" fill="url(#ivoryBottom)"/>
  <rect x="1250" y="843" width="1250" height="843" fill="url(#greenBottom)"/>
  <rect width="2500" height="1686" fill="url(#grain)"/>

  <g fill="none" stroke-width="4">
    <path d="M-90 690c300-205 490 115 760-60s420-145 680 20" stroke="#315e58" opacity=".07"/>
    <path d="M1160 205c275-195 475 130 760-38s430-120 690 26" stroke="#efd6ad" opacity=".11"/>
    <path d="M-80 1530c290-210 500 125 775-48s410-125 655 8" stroke="#315e58" opacity=".065"/>
    <path d="M1160 1510c300-210 505 135 785-42s420-110 660 30" stroke="#efd6ad" opacity=".09"/>
  </g>

