      .desc{font:500 34px "Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;letter-spacing:1px}
      .cta{font:700 31px "Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;letter-spacing:1px}
      .icon{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:15}
    </style>
  </defs>

  <rect width="1250" height="843" fill="url(#ivoryTop)"/>
